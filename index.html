<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { margin-bottom: 8px; }
    p { color: #94a3b8; }
    #result {
      font-size: 1.6rem;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      min-width: 280px;
      max-width: 90%;
      margin: 24px 0;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { background: #4f46e5; }
    .secondary { background: #334155; }
  </style>
</head>
<body>
  <h1>My Generator</h1>
  <p>Click the button to create something new.</p>

  <div id="result">Press Generate!</div>

  <div>
    <button onclick="generate()">Generate</button>
    <button class="secondary" onclick="copyResult()">Copy</button>
  </div>

  <script>
    const first = ["Cosmic", "Swift", "Golden", "Silent", "Brave", "Neon"];
    const second = ["Falcon", "Project", "Studio", "Wave", "Forge", "Labs"];

    function generate() {
      const a = first[Math.floor(Math.random() * first.length)];
      const b = second[Math.floor(Math.random() * second.length)];
      document.getElementById("result").textContent = a + " " + b;
    }

    function copyResult() {
      navigator.clipboard.writeText(document.getElementById("result").textContent);
    }
  </script>
</body>
</html>
